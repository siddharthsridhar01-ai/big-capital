# Runs the two things that must happen close to a market event, worldwide:
#   1. Capture each exchange's official close as soon as that exchange closes,
#      so price lists and charts update within ~30 minutes (not once nightly).
#   2. Fill queued market-on-open orders shortly after their exchange opens.
#
# Exchanges open and close at different times around the clock (Tokyo ~00:00 and
# ~06:00 UTC, London ~08:00 and ~15:30/16:30 depending on DST, New York ~13:30
# and ~20:00/21:00), so this runs frequently. Both endpoints are idempotent and
# skip anything not yet due, and the closes job re-scans a ~6-day trailing
# window, so a missed run is picked up by the next one.
#
# STEP INDEPENDENCE: both steps always run, then a final step fails the job if
# either failed. Previously the closes step swallowed its own errors with
# "|| echo" while the fill step failed hard — so a 401 showed up as one green
# step and one red step, which badly misled diagnosis.
#
# Requires the CRON_SECRET repository secret (same one used by keep-data-fresh).
name: Market tick (closes + queued orders)

on:
  schedule:
    # Every 30 minutes, Mon-Fri. GitHub schedules are best-effort, so both jobs
    # are written to retry anything still outstanding on the next run.
    - cron: "*/30 * * * 1-5"
  workflow_dispatch: {}

env:
  BASE_URL: https://big-capital.vercel.app

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Capture finalised closes
        id: closes
        run: |
          code=$(curl -s -o /tmp/closes.json -w "%{http_code}" --max-time 180 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/closes" || echo 000)
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "CLOSES -> HTTP $code"
          head -c 500 /tmp/closes.json 2>/dev/null || true

      - name: Fill queued orders
        id: fill
        if: always()
        run: |
          code=$(curl -s -o /tmp/fill.json -w "%{http_code}" --max-time 180 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/fill-orders" || echo 000)
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "FILL -> HTTP $code"
          head -c 500 /tmp/fill.json 2>/dev/null || true

      # Self-heal BEFORE checking. runNavSnapshot only computes days that are
      # actually missing, so with nothing to do this is a couple of small queries
      # and no writes. When the nightly job has failed, this closes the gap within
      # the hour instead of leaving funds stale until someone notices.
      #
      # Non-fatal on purpose: a failure here is reported by the freshness check
      # below, which is the honest signal. Failing the run twice for one problem
      # only makes the email harder to read.
      - name: NAV catch-up
        id: navcatchup
        if: always()
        run: |
          code=$(curl -s -o /tmp/catchup.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/nav-catchup" || echo 000)
          echo "CATCHUP -> HTTP $code"
          cat /tmp/catchup.json 2>/dev/null || true
          echo ""

      # Watchdog. This workflow runs every half hour and has proved reliable; the
      # nightly NAV job has not. On 10 Aug the nightly job began returning 504 and
      # every fund's NAV silently froze for four days while prices kept updating,
      # so the site looked healthy. Checking freshness from HERE means a failure
      # of the fragile job is reported by a job that actually runs.
      - name: Data freshness
        id: health
        if: always()
        run: |
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/health" || echo 000)
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "HEALTH -> HTTP $code"
          cat /tmp/health.json 2>/dev/null || true
          echo ""

      - name: Report
        if: always()
        run: |
          closes="${{ steps.closes.outputs.status }}"
          fill="${{ steps.fill.outputs.status }}"
          health="${{ steps.health.outputs.status }}"
          echo "closes=$closes fill=$fill health=$health"
          bad=0
          if [ "$health" = "503" ]; then
            echo "::error::DATA IS STALE — see the Data freshness step above. NAV or prices have stopped updating."
            bad=1
          elif [ "${health#2}" = "$health" ]; then
            echo "::error::health check returned HTTP $health."
            bad=1
          fi
          for pair in "closes:$closes" "fill:$fill"; do
            name="${pair%%:*}"; code="${pair##*:}"
            case "$code" in
              2*) ;;
              401) echo "::error::$name returned 401 — the CRON_SECRET repository secret is missing or does not match Vercel."; bad=1 ;;
              000) echo "::error::$name could not be reached (network error or timeout)."; bad=1 ;;
              *)   echo "::error::$name returned HTTP $code."; bad=1 ;;
            esac
          done
          exit $bad
