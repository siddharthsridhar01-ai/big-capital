# Nightly refresh: FX rates -> prices -> NAV snapshot.
#
# GitHub Actions is the ONLY scheduler for this job. The vercel.json crons that
# used to duplicate it were removed: Vercel's Hobby plan did not run them
# reliably (the benchmark silently went stale for ~2 weeks), and having two
# schedules 20 minutes apart made it impossible to reason about when anything
# actually ran.
#
# WHY 22:40 UTC: late enough that every market has closed and reported (US
# closes 20:00-21:00 UTC depending on DST) and the ECB has published the day's
# FX; early enough that scheduler drift cannot push the run past midnight UTC.
# That matters because a NAV snapshot is stamped with the UTC date at run time —
# a run that slipped past 00:00 would file today's closes under tomorrow.
#
# STEP INDEPENDENCE: every step runs even if an earlier one failed, then a final
# step fails the job if anything went wrong. Previously a failure in "prices"
# skipped "NAV strike" entirely, so a prices hiccup silently cost that day's NAV
# snapshot — and missed snapshots do NOT self-heal (the nightly job only ever
# computes today; gaps need a manual /api/admin/compute-nav?from=YYYY-MM-DD).
#
# Requires the CRON_SECRET repository secret
# (Settings -> Secrets and variables -> Actions). Without it every call 401s.
name: Keep data fresh

on:
  schedule:
    - cron: "40 22 * * 1-5"
  workflow_dispatch: {}

env:
  BASE_URL: https://big-capital.vercel.app

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: FX rates
        id: fx
        run: |
          code=$(curl -s -o /tmp/fx.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/fx" || echo 000)
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "FX -> HTTP $code"
          head -c 500 /tmp/fx.json 2>/dev/null || true

      - name: Prices (quote + daily closes)
        id: prices
        if: always()
        run: |
          code=$(curl -s -o /tmp/prices.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/prices" || echo 000)
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "PRICES -> HTTP $code"
          head -c 500 /tmp/prices.json 2>/dev/null || true

      # Dividends were never scheduled: the route existed but nothing called it,
      # so income was credited only when someone ran it by hand. Runs before the
      # NAV strike so a dividend is booked on its ex-date, offsetting that day's
      # ex-dividend price drop rather than showing it as a loss. Idempotent.
      - name: Dividends
        id: div
        if: always()
        run: |
          code=$(curl -s -o /tmp/div.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/dividends" || echo 000)
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "DIVIDENDS -> HTTP $code"
          head -c 800 /tmp/div.json 2>/dev/null || true

      - name: Corporate actions
        if: always()
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/ca.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/corporate-actions?mode=process" || echo 000)
          echo "CORPORATE-ACTIONS -> HTTP $code"
          head -c 800 /tmp/ca.json 2>/dev/null || true

      - name: NAV strike
        id: nav
        if: always()
        run: |
          code=$(curl -s -o /tmp/nav.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/nav" || echo 000)
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "NAV -> HTTP $code"
          head -c 500 /tmp/nav.json 2>/dev/null || true

      # Flags held securities showing the signature of an event that is not
      # processed automatically: a large unexplained move (spin-off, rights
      # issue, takeover bid, unprocessed split) or a holding that has stopped
      # being priced (completed takeover, delisting, ticker change). Fails the
      # run so the admins are emailed. Nightly, so one event is one email.
      - name: Corporate action check
        if: always()
        run: |
          code=$(curl -s -o /tmp/cacheck.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/corporate-actions?mode=check" || echo 000)
          echo "CORPORATE-ACTION-CHECK -> HTTP $code"
          cat /tmp/cacheck.json 2>/dev/null || true
          echo ""
          if [ "$code" = "503" ]; then
            echo "::error::A held security needs attention — likely a corporate action that is not processed automatically. See the alerts above."
            exit 1
          fi

      # 2xx is success. 207 is a legitimate "partial" from these routes (some
      # securities errored but the run completed) and must not fail the job.
      - name: Report
        if: always()
        run: |
          fx="${{ steps.fx.outputs.status }}"
          prices="${{ steps.prices.outputs.status }}"
          nav="${{ steps.nav.outputs.status }}"
          div="${{ steps.div.outputs.status }}"
          echo "fx=$fx prices=$prices dividends=$div nav=$nav"
          bad=0
          for pair in "fx:$fx" "prices:$prices" "dividends:$div" "nav:$nav"; do
            name="${pair%%:*}"; code="${pair##*:}"
            case "$code" in
              2*) ;;
              401) echo "::error::$name returned 401 — the CRON_SECRET repository secret is missing or does not match Vercel."; bad=1 ;;
              000) echo "::error::$name could not be reached (network error or timeout)."; bad=1 ;;
              *)   echo "::error::$name returned HTTP $code."; bad=1 ;;
            esac
          done
          exit $bad
